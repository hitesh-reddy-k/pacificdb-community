name: CodeQL

on:
  pull_request:
    branches: [pacificdb-v1.0]
  push:
    branches: [pacificdb-v1.0]
  schedule:
    - cron: "23 3 * * 2"

permissions:
  contents: read
  security-events: write

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install C++ dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ liblz4-dev libssl-dev
      - uses: github/codeql-action/init@v3
        with:
          languages: cpp,javascript-typescript
          queries: security-extended
      - name: Build C++ engine
        run: |
          cmake -S engine -B build-codeql -DCMAKE_BUILD_TYPE=Release
          cmake --build build-codeql -j2 --target db_engine
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:combined
