name: Build release installers

on:
  workflow_call:
    inputs:
      version:
        description: Version embedded in non-publishing validation artifacts
        required: true
        type: string
    secrets:
      WINDOWS_CERTIFICATE_BASE64:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      MACOS_INSTALLER_CERTIFICATE_BASE64:
        required: false
      MACOS_INSTALLER_CERTIFICATE_PASSWORD:
        required: false
      MACOS_INSTALLER_IDENTITY:
        required: false
      MACOS_KEYCHAIN_PASSWORD:
        required: false
      APPLE_NOTARY_ID:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_APP_SPECIFIC_PASSWORD:
        required: false
  workflow_dispatch:
    inputs:
      version:
        description: Version to build without publishing
        required: true
        default: 0.1.0-beta.14
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo find /etc/apt/sources.list.d -maxdepth 1 -type f \
            \( -iname '*google*' -o -iname '*chrome*' \) -delete
          sudo apt-get update
          sudo apt-get install -y cmake g++ liblz4-dev libssl-dev
      - name: Build Debian package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="${{ inputs.version }}"; fi
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DPACIFICDB_ENGINE_VERSION="$version"
          cmake --build build --config Release --target db_engine pacificdb -j2
          cpack --config build/CPackConfig.cmake -G DEB -B dist
          mv dist/*.deb "dist/pacificdb-community-$version-linux-amd64.deb"
          scripts/test-native-package.sh "dist/pacificdb-community-$version-linux-amd64.deb" "$version"
          package_root="$RUNNER_TEMP/p0-installed"
          dpkg-deb -x "dist/pacificdb-community-$version-linux-amd64.deb" "$package_root"
          PACIFICDB_P0_EXPECTED_VERSION="$version" \
            PACIFICDB_P0_MEDIA_100MB=1 PACIFICDB_P0_SOAK=1 \
            node scripts/test-p0-installed.mjs "$package_root/usr" \
            "$RUNNER_TEMP/p0-evidence-linux-amd64.json"
          mv "$RUNNER_TEMP/p0-evidence-linux-amd64.json" dist/p0-evidence-linux-amd64.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            dist/pacificdb-community-*-linux-amd64.deb
            dist/p0-evidence-linux-amd64.json

  windows:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - name: Install packaging dependencies
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          vcpkg install --triplet x64-windows-static
      - name: Build Windows installer
        shell: pwsh
        env:
          CERT_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          if (-not $env:GITHUB_REF.StartsWith('refs/tags/v')) { $version = '${{ inputs.version }}' }
          cmake -S engine -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_INSTALLED_DIR="$pwd/vcpkg_installed" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DPACIFICDB_ENGINE_VERSION="$version"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target db_engine pacificdb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hasCertificate = $env:CERT_BASE64 -and $env:CERT_PASS
          if ($env:GITHUB_REF.StartsWith('refs/tags/v') -and -not $hasCertificate) {
            throw "Windows signing secrets are required for release tags"
          }
          $certPath = $null
          $signtool = $null
          function Invoke-CodeSigning([string[]] $files) {
            foreach ($file in $files) {
              & $signtool sign /f $certPath /p $env:CERT_PASS /tr https://timestamp.digicert.com /td sha256 /fd sha256 $file
              if ($LASTEXITCODE -ne 0) { throw "Failed to sign $file" }
              & $signtool verify /pa /v $file
              if ($LASTEXITCODE -ne 0) { throw "Failed to verify $file" }
            }
          }
          $env:PACIFICDB_ENVIRONMENT = "development"
          $env:PACIFICDB_HOME = "$pwd/package-test"
          $env:DATA_ROOT = "$env:PACIFICDB_HOME/data"
          $env:BACKUP_ROOT = "$env:PACIFICDB_HOME/backup"
          $env:RESTORE_DIR = "$env:PACIFICDB_HOME/restore"
          $env:ENGINE_BIND_HOST = "127.0.0.1"
          $env:ENGINE_AUTH_REQUIRED = "0"
          $env:RAFT_CLUSTER_ID = "pacificdb-local"
          $env:RAFT_NODE_ID = "node-1"
          $env:RAFT_IS_LEADER = "1"
          $env:MIN_QUORUM_SIZE = "1"
          $env:ENGINE_PORT = "19000"
          $env:RAFT_LISTEN_PORT = "19001"
          $env:ENGINE_CPU_CORES = "2"
          $env:CONN_MIN_THREADS = "4"
          $env:CONN_MAX_THREADS = "64"
          $env:DBQ_SHARDS = "4"
          $env:DBQ_WORKERS_PER_SHARD = "2"
          New-Item -ItemType Directory -Force $env:DATA_ROOT,$env:BACKUP_ROOT,$env:RESTORE_DIR | Out-Null
          $serverPid = $null
          try {
            $pingResult = & build/Release/pacificdb.exe --port 19000 ping 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $pingResult -notmatch '"status":\s*"pong"') {
              throw "Built PacificDB did not start automatically: $pingResult"
            }
            $serverPid = Get-Content "$env:PACIFICDB_HOME/engine.pid"
          } finally {
            if ($serverPid) { Stop-Process -Id $serverPid -Force -ErrorAction SilentlyContinue }
          }
          try {
            if ($hasCertificate) {
              $certPath = "$env:RUNNER_TEMP\signing_cert.pfx"
              [IO.File]::WriteAllBytes(
                $certPath, [Convert]::FromBase64String($env:CERT_BASE64))
              $signtool = (Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" |
                Sort-Object FullName -Descending | Select-Object -First 1).FullName
              if (-not $signtool) { throw "SignTool was not found" }
              Invoke-CodeSigning @('build/Release/db_engine.exe', 'build/Release/pacificdb.exe')
            }
            cpack --config build/CPackConfig.cmake -C Release -G NSIS -B dist
            if ($LASTEXITCODE -ne 0) { throw "CPack failed with exit code $LASTEXITCODE" }
            $installer = Get-ChildItem dist/*.exe
            if ($hasCertificate) { Invoke-CodeSigning $installer.FullName }
          } finally {
            if ($certPath) { Remove-Item $certPath -Force -ErrorAction SilentlyContinue }
          }
          $installRoot = "$env:RUNNER_TEMP\PacificDB"
          $install = Start-Process -FilePath $installer.FullName `
            -ArgumentList '/S', "/D=$installRoot" -PassThru
          if (-not $install.WaitForExit(60000)) {
            Stop-Process -Id $install.Id -Force
            throw "Windows installer timed out"
          }
          if ($install.ExitCode -ne 0) { exit $install.ExitCode }
          $bin = "$installRoot\bin"
          if (-not (Test-Path "$bin\pacificdb.exe") -or
              -not (Test-Path "$bin\db_engine.exe") -or
              -not (Test-Path "$installRoot\share\pacificdb\pacificdb-logo.png")) {
            throw "Windows installer did not install all commands"
          }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -notcontains $bin) {
            throw "Windows installer did not add PacificDB to the user PATH"
          }
          $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine') + ";$userPath"
          if ((Get-Command pacificdb).Source -ne "$bin\pacificdb.exe") {
            throw "unqualified pacificdb does not resolve to the Community executable"
          }
          $windowsSigningStatus = if ($hasCertificate) { 'PASS' } else { 'NOT_APPLICABLE' }
          if ($hasCertificate) {
            $pacificdbSignature = Get-AuthenticodeSignature "$bin\pacificdb.exe"
            $engineSignature = Get-AuthenticodeSignature "$bin\db_engine.exe"
            if ($pacificdbSignature.Status -ne 'Valid') {
              throw "Installed pacificdb.exe Authenticode signature is not valid"
            }
            if ($engineSignature.Status -ne 'Valid') {
              throw "Installed db_engine.exe Authenticode signature is not valid"
            }
          }
          $env:PACIFICDB_HOME = "$env:RUNNER_TEMP\pacificdb-installed-test"
          Remove-Item Env:DATA_ROOT,Env:BACKUP_ROOT,Env:RESTORE_DIR -ErrorAction SilentlyContinue
          $env:ENGINE_PORT = "19100"
          $env:RAFT_LISTEN_PORT = "19101"
          $localPid = $null
          try {
            $pingResult = & "$bin\pacificdb.exe" --port 19100 ping 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $pingResult -notmatch '"status":\s*"pong"') {
              throw "Installed PacificDB did not start automatically: $pingResult"
            }
            $localPid = Get-Content "$env:PACIFICDB_HOME/engine.pid"
            $writeResult = & "$bin\pacificdb.exe" --port 19100 request `
              '{"action":"createDatabase","dbName":"package_test"}' 2>&1 | Out-String
            if ($LASTEXITCODE -ne 0 -or $writeResult -notmatch '"status":\s*"ok"') {
              throw "Installed PacificDB could not write: $writeResult"
            }
          } finally {
            if ($localPid) { Stop-Process -Id $localPid -Force -ErrorAction SilentlyContinue }
          }
          $env:PACIFICDB_P0_MEDIA_100MB = '1'
          $env:PACIFICDB_P0_SOAK = '1'
          $env:PACIFICDB_P0_SOAK_WRITES = '25000'
          $env:PACIFICDB_P0_EXPECTED_VERSION = $version
          $evidencePath = "$env:RUNNER_TEMP\p0-evidence-windows-x64.json"
          & scripts/test-p0-windows.ps1 -PackageRoot $installRoot `
            -EvidencePath $evidencePath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $evidence = Get-Content $evidencePath -Raw | ConvertFrom-Json
          $evidence | Add-Member -NotePropertyName revision `
            -NotePropertyValue $env:GITHUB_SHA -Force
          $evidence | Add-Member -NotePropertyName windows_signing `
            -NotePropertyValue ([ordered]@{
              status = $windowsSigningStatus
              installer = $windowsSigningStatus
              installed_pacificdb = $windowsSigningStatus
              installed_db_engine = $windowsSigningStatus
            }) -Force
          $evidence | ConvertTo-Json -Depth 10 | Set-Content $evidencePath -Encoding utf8
          $uninstall = Start-Process -FilePath "$installRoot\Uninstall.exe" `
            -ArgumentList '/S', "_?=$installRoot" -PassThru
          if (-not $uninstall.WaitForExit(60000)) {
            Stop-Process -Id $uninstall.Id -Force
            throw "Windows uninstaller timed out"
          }
          if ($uninstall.ExitCode -ne 0) { exit $uninstall.ExitCode }
          $userPath = [Environment]::GetEnvironmentVariable('Path', 'User')
          if (($userPath -split ';') -contains $bin) {
            throw "Windows uninstaller did not remove PacificDB from PATH"
          }
          Rename-Item $installer.FullName "pacificdb-community-$version-windows-x64.exe"
          Move-Item $evidencePath "dist\p0-evidence-windows-x64.json"
      - uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: |
            dist/pacificdb-community-*-windows-x64.exe
            dist/p0-evidence-windows-x64.json

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake lz4 openssl@3
      - name: Build macOS installer
        shell: bash
        env:
          MACOS_INSTALLER_CERTIFICATE_BASE64: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_BASE64 }}
          MACOS_INSTALLER_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_PASSWORD }}
          MACOS_INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          APPLE_NOTARY_ID: ${{ secrets.APPLE_NOTARY_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          signing_p12="$RUNNER_TEMP/pacificdb-installer.p12"
          signing_keychain="$RUNNER_TEMP/pacificdb-signing.keychain-db"
          cleanup_macos_signing() {
            rm -f "$signing_p12" "$RUNNER_TEMP/notary-result.json"
            security delete-keychain "$signing_keychain" >/dev/null 2>&1 || true
          }
          trap cleanup_macos_signing EXIT

          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="${{ inputs.version }}"; fi
          is_release_tag=false
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then is_release_tag=true; fi
          signing_values=(
            "$MACOS_INSTALLER_CERTIFICATE_BASE64"
            "$MACOS_INSTALLER_CERTIFICATE_PASSWORD"
            "$MACOS_INSTALLER_IDENTITY"
            "$MACOS_KEYCHAIN_PASSWORD"
            "$APPLE_NOTARY_ID"
            "$APPLE_TEAM_ID"
            "$APPLE_APP_SPECIFIC_PASSWORD"
          )
          configured_signing_values=0
          for value in "${signing_values[@]}"; do
            if [[ -n "$value" ]]; then
              configured_signing_values=$((configured_signing_values + 1))
            fi
          done
          has_signing_credentials=false
          if [[ "$configured_signing_values" -eq "${#signing_values[@]}" ]]; then
            has_signing_credentials=true
          elif [[ "$configured_signing_values" -ne 0 ]]; then
            echo "macOS signing credentials must be configured as one complete set" >&2
            exit 1
          fi
          if [[ "$is_release_tag" == true && "$has_signing_credentials" != true ]]; then
            echo "macOS signing and notarization credentials are required for release tags" >&2
            exit 1
          fi

          if [[ "$has_signing_credentials" == true ]]; then
            printf '%s' "$MACOS_INSTALLER_CERTIFICATE_BASE64" | /usr/bin/base64 -D > "$signing_p12"
            chmod 600 "$signing_p12"
            security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$signing_keychain"
            security set-keychain-settings -lut 21600 "$signing_keychain"
            security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$signing_keychain"
            security import "$signing_p12" -k "$signing_keychain" \
              -P "$MACOS_INSTALLER_CERTIFICATE_PASSWORD" -T /usr/bin/productsign
            security set-key-partition-list -S apple-tool:,apple: -s \
              -k "$MACOS_KEYCHAIN_PASSWORD" "$signing_keychain"
            security list-keychains -d user -s "$signing_keychain" \
              "$HOME/Library/Keychains/login.keychain-db"
          fi

          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release \
            -DOPENSSL_ROOT_DIR="$(brew --prefix openssl@3)" \
            -DLZ4_LIBRARY="$(brew --prefix lz4)/lib/liblz4.dylib" \
            -DPACIFICDB_ENGINE_VERSION="$version"
          cmake --build build --target db_engine pacificdb -j2
          export PACIFICDB_ENVIRONMENT=development
          export PACIFICDB_HOME="$RUNNER_TEMP/package-test"
          export DATA_ROOT="$PACIFICDB_HOME/data"
          export BACKUP_ROOT="$PACIFICDB_HOME/backup"
          export RESTORE_DIR="$PACIFICDB_HOME/restore"
          export ENGINE_BIND_HOST=127.0.0.1 ENGINE_AUTH_REQUIRED=0
          export RAFT_CLUSTER_ID=pacificdb-local RAFT_NODE_ID=node-1
          export RAFT_IS_LEADER=1 MIN_QUORUM_SIZE=1
          export ENGINE_PORT=19000 RAFT_LISTEN_PORT=19001 ENGINE_CPU_CORES=2
          export CONN_MIN_THREADS=4 CONN_MAX_THREADS=64
          export DBQ_SHARDS=4 DBQ_WORKERS_PER_SHARD=2
          mkdir -p "$DATA_ROOT" "$BACKUP_ROOT" "$RESTORE_DIR"
          build/pacificdb --port 19000 ping | grep -q pong
          build/pacificdb --port 19000 request \
            '{"action":"createDatabase","dbName":"package_test"}' | grep -q '"status": "ok"'
          server_pid=$(cat "$PACIFICDB_HOME/engine.pid")
          kill "$server_pid"
          for _ in {1..60}; do
            if ! kill -0 "$server_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          package_root="$RUNNER_TEMP/package-root"
          cmake --install build --prefix "$package_root/usr/local"
          mkdir -p dist
          unsigned_package="$RUNNER_TEMP/pacificdb-community-$version-macos-${{ matrix.arch }}-unsigned.pkg"
          package="dist/pacificdb-community-$version-macos-${{ matrix.arch }}.pkg"
          pkgbuild --root "$package_root" --install-location / \
            --identifier com.pacificdb.community --version "${version%%-*}" "$unsigned_package"
          signing_status="NOT_APPLICABLE"
          if [[ "$has_signing_credentials" == true ]]; then
            productsign --sign "$MACOS_INSTALLER_IDENTITY" \
              --keychain "$signing_keychain" "$unsigned_package" "$package"
            rm -f "$unsigned_package"
            pkgutil --check-signature "$package"
            xcrun notarytool submit "$package" \
              --apple-id "$APPLE_NOTARY_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_SPECIFIC_PASSWORD" \
              --wait --output-format json > "$RUNNER_TEMP/notary-result.json"
            notary_status=$(python3 -c \
              'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["status"])' \
              "$RUNNER_TEMP/notary-result.json")
            if [[ "$notary_status" != Accepted ]]; then
              echo "Apple notarization did not return Accepted" >&2
              exit 1
            fi
            xcrun stapler staple "$package"
            xcrun stapler validate "$package"
            spctl --assess --type install --verbose=2 "$package"
            signing_status="PASS"
          else
            mv "$unsigned_package" "$package"
          fi
          pkgutil --payload-files "$package" | grep -q 'usr/local/bin/db_engine$'
          pkgutil --payload-files "$package" | grep -q 'usr/local/bin/pacificdb$'
          pkgutil --payload-files "$package" | grep -q 'usr/local/share/pacificdb/pacificdb-logo.png$'
          sudo installer -pkg "$package" -target /
          export PACIFICDB_HOME="$RUNNER_TEMP/installed-test"
          export ENGINE_PORT=19100 RAFT_LISTEN_PORT=19101
          unset DATA_ROOT BACKUP_ROOT RESTORE_DIR
          /usr/local/bin/pacificdb --port 19100 ping | grep -q pong
          installed_pid=$(cat "$PACIFICDB_HOME/engine.pid")
          kill "$installed_pid"
          for _ in {1..60}; do
            if ! kill -0 "$installed_pid" 2>/dev/null; then break; fi
            sleep 0.25
          done
          PACIFICDB_P0_EXPECTED_VERSION="$version" \
            PACIFICDB_P0_MEDIA_100MB=1 PACIFICDB_P0_SOAK=1 \
            node scripts/test-p0-installed.mjs /usr/local \
            "$RUNNER_TEMP/p0-evidence-macos-${{ matrix.arch }}.json"
          evidence_path="$RUNNER_TEMP/p0-evidence-macos-${{ matrix.arch }}.json"
          python3 - "$evidence_path" "$GITHUB_SHA" "${{ matrix.arch }}" "$signing_status" <<'PY'
          import json
          import pathlib
          import sys

          path = pathlib.Path(sys.argv[1])
          evidence = json.loads(path.read_text(encoding="utf-8"))
          evidence["revision"] = sys.argv[2]
          evidence["release_architecture"] = sys.argv[3]
          evidence["macos_signing"] = {
              "status": sys.argv[4],
              "signature": sys.argv[4],
              "notarization": sys.argv[4],
              "stapling": sys.argv[4],
              "gatekeeper": sys.argv[4],
          }
          path.write_text(json.dumps(evidence, indent=2) + "\n", encoding="utf-8")
          PY
          mv "$RUNNER_TEMP/p0-evidence-macos-${{ matrix.arch }}.json" \
            "dist/p0-evidence-macos-${{ matrix.arch }}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            dist/pacificdb-community-*-macos-${{ matrix.arch }}.pkg
            dist/p0-evidence-macos-${{ matrix.arch }}.json

  container:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      IMAGE_NAME: ghcr.io/hitesh-reddy-k/pacificdb-community
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable image metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then version="${{ inputs.version }}"; fi
          created=$(git show -s --format=%cI HEAD)
          printf 'IMAGE_VERSION=%s\nIMAGE_CREATED=%s\nLOCAL_IMAGE=pacificdb-community:ci-%s\n' \
            "$version" "$created" "$GITHUB_SHA" >> "$GITHUB_ENV"
      - name: Build local validation image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          build-args: |
            PACIFICDB_ENGINE_VERSION=${{ env.IMAGE_VERSION }}
            PACIFICDB_GIT_COMMIT=${{ github.sha }}
            PACIFICDB_BUILD_TIMESTAMP=${{ env.IMAGE_CREATED }}
      - name: Smoke-test local validation image
        run: |
          mkdir -p dist
          scripts/test-container-image.sh "$LOCAL_IMAGE" \
            dist/p0-evidence-linux-amd64-container.json
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        with:
          name: linux-amd64-container
          path: |
            dist/p0-evidence-linux-amd64-container.json

  container_publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [container]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_NAME: ghcr.io/hitesh-reddy-k/pacificdb-community
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Resolve immutable image metadata
        shell: bash
        run: |
          set -euo pipefail
          printf 'IMAGE_VERSION=%s\nIMAGE_CREATED=%s\n' "${GITHUB_REF_NAME#v}" \
            "$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
      - name: Authenticate to GHCR for release digest
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build and push release image by digest
        id: release_image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true
          build-args: |
            PACIFICDB_ENGINE_VERSION=${{ env.IMAGE_VERSION }}
            PACIFICDB_GIT_COMMIT=${{ github.sha }}
            PACIFICDB_BUILD_TIMESTAMP=${{ env.IMAGE_CREATED }}
      - name: Smoke-test exact release digest
        env:
          RELEASE_DIGEST: ${{ steps.release_image.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p dist
          image="$IMAGE_NAME@$RELEASE_DIGEST"
          docker pull "$image"
          scripts/test-container-image.sh "$image" \
            dist/p0-evidence-linux-amd64-container.json
      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64-container
          path: |
            dist/p0-evidence-linux-amd64-container.json

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, container_publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_NAME: ghcr.io/hitesh-reddy-k/pacificdb-community
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Publish checksummed GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd dist
          python3 ../scripts/verify-release-artifacts.py \
            --dist . --version "${GITHUB_REF_NAME#v}" --revision "$GITHUB_SHA" \
            --output RELEASE-MANIFEST.json
          sha256sum pacificdb-community-* p0-evidence-*.json RELEASE-MANIFEST.json > SHA256SUMS
          notes="../docs/releases/$GITHUB_REF_NAME.md"
          if test -f "$notes"; then
            gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
              --draft --prerelease --notes-file "$notes"
          else
            gh release create "$GITHUB_REF_NAME" * --repo "$GITHUB_REPOSITORY" \
              --draft --prerelease --generate-notes
          fi
          verify_dir="$RUNNER_TEMP/published-release"
          mkdir -p "$verify_dir"
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir "$verify_dir"
          (cd "$verify_dir" && sha256sum -c SHA256SUMS)
          image_ref=$(jq -r '.image' p0-evidence-linux-amd64-container.json)
          test "$image_ref" = "$(jq -r '.oci_image' RELEASE-MANIFEST.json)"
          docker buildx imagetools inspect "$image_ref" >/dev/null
          image_alias="$IMAGE_NAME:${GITHUB_REF_NAME#v}"
          docker buildx imagetools create \
            --tag "$image_alias" "$image_ref"
          alias_digest=$(docker buildx imagetools inspect "$image_alias" |
            awk '$1 == "Digest:" {print $2; exit}')
          test "$alias_digest" = "${image_ref#*@}"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease
