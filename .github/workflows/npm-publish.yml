name: Publish npm release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:npm
      - name: Verify tag and package versions
        shell: bash
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          client_version="$(node -p "require('./sdk/node/package.json').version")"
          cli_version="$(node -p "require('./cli/package.json').version")"
          cli_client_version="$(node -p "require('./cli/package.json').dependencies['@pacificdb/client']")"
          test "$client_version" = "$version"
          test "$cli_version" = "$version"
          test "$cli_client_version" = "$version"
      - name: Publish client then CLI under the latest tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm publish --workspace @pacificdb/client --tag latest
          npm publish --workspace @pacificdb/cli --tag latest
