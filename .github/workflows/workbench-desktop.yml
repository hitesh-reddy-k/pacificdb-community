name: PacificDB Workbench desktop

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-desktop.yml'
      - 'desktop/**'
      - 'cli/**'
      - 'sdk/node/**'
      - 'engine/**'
      - 'scripts/test-workbench-*.mjs'
      - 'scripts/test-desktop-engine.mjs'
      - 'scripts/test-index-low-cardinality.mjs'
      - 'scripts/prepare-workbench-desktop.mjs'
      - 'release.json'
      - 'scripts/release_identity.py'
      - 'scripts/workbench-preview-evidence.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [main, v1.2]
    tags: ['workbench-v*', 'v*-rc.*']
    paths:
      - '.github/workflows/workbench-desktop.yml'
      - 'desktop/**'
      - 'cli/**'
      - 'sdk/node/**'
      - 'engine/**'
      - 'scripts/test-workbench-*.mjs'
      - 'scripts/test-desktop-engine.mjs'
      - 'scripts/test-index-low-cardinality.mjs'
      - 'scripts/prepare-workbench-desktop.mjs'
      - 'release.json'
      - 'scripts/release_identity.py'
      - 'scripts/workbench-preview-evidence.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      verify_publication:
        description: Download and install-test the public RC packages on all desktop platforms
        type: boolean
        default: false
      publish_desktop:
        description: Build Linux RC and publish tested desktop installers
        type: boolean
        default: false
      desktop_source_run:
        description: Exact successful source-build run containing Windows and macOS installers
        required: false
        type: string
      source_ref:
        description: Existing source commit to qualify without changing its identity
        required: false
        type: string
      qualify_candidate:
        description: Run complete Community regressions and real ENOSPC on the frozen source
        type: boolean
        default: false
      assemble_candidate:
        description: Qualify and publish the existing RC tag from successful frozen-source CI artifacts
        type: boolean
        default: false
      attach_company_guide:
        description: Attach current company guidance without replacing released program bytes
        type: boolean
        default: false
      prepare_benchmark_inputs:
        description: Independently reproduce and attach the checksum-frozen public 1M workload
        type: boolean
        default: false
      verify_assets:
        description: Independently download and hash-check all public prerelease assets
        type: boolean
        default: false
      native_source_run:
        description: Successful native and SDK prerelease qualification run
        required: false
        type: string
      linux_source_run:
        description: Exact-source successful Linux installer job when rerun separately
        required: false
        type: string
      qualification_run:
        description: Successful complete frozen Community regression run
        required: false
        type: string
      publish_container:
        description: Publish only the qualified public RC container
        type: boolean
        default: false
      release_tag:
        description: Exact existing workbench-vMAJOR.MINOR.PATCH tag to retry
        required: false

env:
  WORKBENCH_RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/workbench-v') && github.ref_name) || '' }}

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.ref }}-${{ inputs.verify_assets && 'public-asset-integrity' || inputs.prepare_benchmark_inputs && 'benchmark-inputs' || inputs.attach_company_guide && 'company-guide' || inputs.assemble_candidate && 'assembly' || inputs.qualify_candidate && 'qualification' || inputs.publish_desktop && 'desktop-publication' || inputs.verify_publication && 'public-consumer' || inputs.source_ref || 'platform' }}
  cancel-in-progress: false

jobs:
  public_asset_integrity:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_assets
    uses: ./.github/workflows/public-asset-integrity.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ inputs.release_tag }}
  benchmark_inputs:
    if: github.event_name == 'workflow_dispatch' && inputs.prepare_benchmark_inputs
    uses: ./.github/workflows/benchmark-inputs.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ inputs.release_tag }}
  company_guide:
    if: github.event_name == 'workflow_dispatch' && inputs.attach_company_guide
    uses: ./.github/workflows/company-guide.yml
    permissions:
      contents: write
    with:
      release_tag: ${{ inputs.release_tag }}
  assemble_frozen_candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.assemble_candidate
    uses: ./.github/workflows/assemble-prerelease.yml
    permissions:
      contents: write
      actions: read
    with:
      release_tag: ${{ inputs.release_tag }}
      native_run: ${{ inputs.native_source_run }}
      platform_run: ${{ inputs.desktop_source_run }}
      linux_run: ${{ inputs.linux_source_run || inputs.desktop_source_run }}
      qualification_run: ${{ inputs.qualification_run }}
  qualify_frozen_candidate:
    if: github.event_name == 'workflow_dispatch' && inputs.qualify_candidate
    uses: ./.github/workflows/qualify-candidate.yml
    permissions:
      contents: read
    with:
      source_ref: ${{ inputs.source_ref }}
  verify_prerelease_publication:
    if: github.event_name == 'workflow_dispatch' && inputs.verify_publication
    uses: ./.github/workflows/verify-prerelease.yml
    permissions:
      contents: read
    with:
      release_tag: ${{ inputs.release_tag }}
  prerelease_container:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_container
    uses: ./.github/workflows/container-prerelease.yml
    permissions:
      contents: read
      packages: write
    with:
      release_tag: ${{ inputs.release_tag }}
  linux:
    if: inputs.release_tag == '' && !inputs.qualify_candidate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKBENCH_RELEASE_TAG || inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Workbench and component versions
        run: |
          echo "WORKBENCH_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "PACIFICDB_COMPONENT_VERSION=$(python3 scripts/release_identity.py --field version)" >> "$GITHUB_ENV"
      - name: Validate candidate tag identity
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./release.json").tag')"
      - name: Install native and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ liblz4-dev libre2-dev libssl-dev xvfb \
            xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1
      - run: npm ci --no-audit --no-fund
      - run: npm run test:npm
      - run: npm run test:build-tools
      - run: node --test scripts/test-workbench-preview-evidence.mjs
      - name: Build native engine and CLI
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release \
            -DPACIFICDB_ENGINE_VERSION="$PACIFICDB_COMPONENT_VERSION"
          cmake --build build --target db_engine pacificdb -j2
      - run: node scripts/test-workbench-e2e.mjs build
      - run: node scripts/test-desktop-engine.mjs build
      - run: node scripts/test-workbench-desktop-vector-preview.mjs build
      - run: node scripts/test-index-low-cardinality.mjs build
      - name: Browser workflow
        run: |
          npx playwright install --with-deps chromium
          # The runner no longer consistently installs Google Chrome's helper.
          # Install the helper from the pinned Playwright Chrome download into a
          # root-owned directory, preserving the normal Chromium OS sandbox.
          bundled_helper=$(node --input-type=module -e 'import {chromium} from "playwright";import path from "node:path";process.stdout.write(path.join(path.dirname(chromium.executablePath()),"chrome_sandbox"))')
          test -f "$bundled_helper"
          sudo install -d -m 0755 /usr/local/libexec/pacificdb-ci
          helper=/usr/local/libexec/pacificdb-ci/chrome-sandbox
          sudo install -o root -g root -m 4755 "$bundled_helper" "$helper"
          test "$(stat -c '%u:%a' "$helper")" = 0:4755
          CHROME_DEVEL_SANDBOX="$helper" npm run test:workbench:browser -- build
          CHROME_DEVEL_SANDBOX="$helper" node scripts/test-workbench-short-window.mjs
      - name: Package Workbench for Ubuntu 24.04
        env:
          PACIFICDB_DESKTOP_UBUNTU_24: '1'
          PACIFICDB_DESKTOP_RELEASE: '1'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        run: npm run desktop:build -- --linux deb tar.gz --x64 --publish never
      - name: Download and install previous Workbench Debian
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/PacificDB-Workbench-1.1.1-linux-amd64.deb"
          curl -fL --retry 3 \
            "https://github.com/hitesh-reddy-k/pacificdb-community/releases/download/workbench-v1.1.1/PacificDB-Workbench-1.1.1-linux-amd64.deb" \
            -o "$previous"
          sudo apt-get install -y "$previous"
          sudo cp -a "/opt/PacificDB Workbench" "$RUNNER_TEMP/workbench-previous-linux"
      - name: Remove previous Workbench Debian
        run: sudo apt-get remove -y pacificdb-workbench
      - name: Install and test candidate Workbench Debian
        shell: bash
        run: |
          set -euo pipefail
          candidate="$PWD/dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb"
          test -f "$candidate"
          sudo apt-get install -y "$candidate"
          mkdir -p "$RUNNER_TEMP/workbench-data-linux"
          PACIFICDB_TEST_DESKTOP_PREVIOUS="$RUNNER_TEMP/workbench-previous-linux/pacificdb-workbench" \
            PACIFICDB_TEST_DESKTOP="/opt/PacificDB Workbench/pacificdb-workbench" \
            PACIFICDB_TEST_DESKTOP_DATA="$RUNNER_TEMP/workbench-data-linux" \
            xvfb-run -a npm run test:workbench:desktop
          PACIFICDB_TEST_DESKTOP="/opt/PacificDB Workbench/pacificdb-workbench" \
            xvfb-run -a npm run test:workbench:desktop
      - name: Remove candidate Workbench Debian and verify data preservation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get remove -y pacificdb-workbench
          test -d "$RUNNER_TEMP/workbench-data-linux/database"
      - name: Record Linux platform evidence
        if: ${{ !contains(env.WORKBENCH_VERSION, '-') }}
        run: |
          python3 scripts/workbench_release_qualification.py platform \
            --name linux-x64 --version "$WORKBENCH_VERSION" \
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb" \
            --output build/workbench-linux-x64.json
          mkdir -p build/workbench-upload
          cp "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb" \
            build/workbench-linux-x64.json build/workbench-upload/
      - name: Record Linux preview staging evidence
        if: contains(env.WORKBENCH_VERSION, '-')
        run: |
          node scripts/workbench-preview-evidence.mjs linux-x64 "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb" build/workbench-linux-x64-preview.json
          mkdir -p build/workbench-upload
          cp "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb" build/workbench-linux-x64-preview.json build/workbench-upload/
      - uses: actions/upload-artifact@v6
        with:
          name: workbench-linux-x64
          if-no-files-found: error
          path: build/workbench-upload/*

  windows:
    if: inputs.release_tag == '' && !inputs.qualify_candidate
    runs-on: windows-2025
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      PACIFICDB_DESKTOP_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/workbench-v') || startsWith(inputs.release_tag, 'workbench-v')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKBENCH_RELEASE_TAG || inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Workbench and component versions
        shell: pwsh
        run: |
          "WORKBENCH_VERSION=$(node -p 'require("./package.json").version')" >> $env:GITHUB_ENV
          "PACIFICDB_COMPONENT_VERSION=$(python scripts/release_identity.py --field version)" >> $env:GITHUB_ENV
      - name: Validate candidate tag identity
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./release.json").tag')"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:npm
      - run: npm run test:build-tools
      - run: node --test scripts/test-workbench-preview-evidence.mjs
      - name: Build static native binaries
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows-static `
            --x-install-root="$pwd/build/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S engine -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_INSTALLED_DIR="$pwd/build/vcpkg_installed" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DPACIFICDB_ENGINE_VERSION="$env:PACIFICDB_COMPONENT_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target db_engine pacificdb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require signing credentials for release tags
        if: env.WORKBENCH_RELEASE_TAG != '' && env.WORKBENCH_RELEASE_TAG != 'workbench-v1.1.1'
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw 'Windows code signing credentials are required for a Workbench release.'
          }
      - name: Verify engine isolation and graceful shutdown
        shell: pwsh
        run: |
          node scripts/test-desktop-engine.mjs build/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node scripts/test-workbench-desktop-vector-preview.mjs build/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign bundled native executables for release tags
        if: env.WORKBENCH_RELEASE_TAG != '' && env.WORKBENCH_RELEASE_TAG != 'workbench-v1.1.1'
        shell: pwsh
        run: |
          $certificate = "$env:RUNNER_TEMP\workbench-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CSC_LINK))
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
            if (-not $signtool) { throw 'SignTool was not found.' }
            foreach ($file in @('build/Release/db_engine.exe', 'build/Release/pacificdb.exe')) {
              & $signtool sign /f $certificate /p $env:CSC_KEY_PASSWORD /tr https://timestamp.digicert.com /td sha256 /fd sha256 $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $signtool verify /pa $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally { Remove-Item $certificate -Force -ErrorAction SilentlyContinue }
      - name: Package Workbench for Windows x64
        shell: pwsh
        run: |
          $env:PACIFICDB_WORKBENCH_ENGINE = "$pwd\build\Release\db_engine.exe"
          $env:ELECTRON_BUILDER_COMPRESSION_LEVEL = '1'
          if ($env:WORKBENCH_RELEASE_TAG -eq 'workbench-v1.1.1') {
            $env:PACIFICDB_DESKTOP_RELEASE = '0'
          }
          if ($env:PACIFICDB_DESKTOP_RELEASE -ne '1') {
            Remove-Item Env:CSC_LINK,Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          npm run desktop:build -- --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and install previous Workbench NSIS
        shell: pwsh
        run: |
          $previous = "$env:RUNNER_TEMP\PacificDB-Workbench-1.1.1-win-x64.exe"
          $installed = "$env:RUNNER_TEMP\workbench-previous-installed"
          $fixture = "$env:RUNNER_TEMP\workbench-previous-fixture"
          Write-Host '[workbench-desktop] download and install previous NSIS'
          Invoke-WebRequest `
            -Uri 'https://github.com/hitesh-reddy-k/pacificdb-community/releases/download/workbench-v1.1.1/PacificDB-Workbench-1.1.1-win-x64.exe' `
            -OutFile $previous
          $process = Start-Process -FilePath $previous -ArgumentList @('/S', "/D=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Copy-Item -Path "$installed\*" -Destination $fixture -Recurse
          Write-Host '[workbench-desktop] previous NSIS installation complete'
      - name: Uninstall previous Workbench NSIS
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem "$env:RUNNER_TEMP\workbench-previous-installed" -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Previous Workbench uninstaller was not found.' }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Install and test candidate Workbench NSIS
        shell: pwsh
        run: |
          $candidate = Get-Item "$pwd\dist\desktop\PacificDB-Workbench-$env:WORKBENCH_VERSION-win-x64.exe"
          $installed = "$env:RUNNER_TEMP\workbench-candidate-installed"
          $data = "$env:RUNNER_TEMP\workbench-data-windows"
          Write-Host '[workbench-desktop] install candidate NSIS'
          $process = Start-Process -FilePath $candidate.FullName -ArgumentList @('/S', "/D=$installed") -PassThru
          if (-not $process.WaitForExit(120000)) {
            Stop-Process -Id $process.Id -Force
            throw 'Candidate Workbench NSIS installation timed out after 120 seconds.'
          }
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          Write-Host '[workbench-desktop] candidate NSIS installation complete; starting installed upgrade test'
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:PACIFICDB_TEST_DESKTOP_PREVIOUS = "$env:RUNNER_TEMP\workbench-previous-fixture\PacificDB Workbench.exe"
          $env:PACIFICDB_TEST_DESKTOP = "$installed\PacificDB Workbench.exe"
          $env:PACIFICDB_TEST_DESKTOP_DATA = $data
          node --test scripts/test-workbench-desktop-lifecycle.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:workbench:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:PACIFICDB_TEST_DESKTOP_PREVIOUS,Env:PACIFICDB_TEST_DESKTOP_DATA -ErrorAction SilentlyContinue
          npm run test:workbench:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Uninstall candidate Workbench NSIS and verify data preservation
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem "$env:RUNNER_TEMP\workbench-candidate-installed" -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Candidate Workbench uninstaller was not found.' }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (-not (Test-Path "$env:RUNNER_TEMP\workbench-data-windows\database" -PathType Container)) {
            throw 'Workbench data directory was removed by uninstall.'
          }
      - name: Record Windows platform evidence
        if: ${{ !contains(env.WORKBENCH_VERSION, '-') }}
        shell: pwsh
        run: |
          git status --porcelain --untracked-files=all
          python scripts/workbench_release_qualification.py platform `
            --name windows-x64 --version $env:WORKBENCH_VERSION `
            --artifact "dist/desktop/PacificDB-Workbench-$env:WORKBENCH_VERSION-win-x64.exe" `
            --output build/workbench-windows-x64.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build/workbench-upload | Out-Null
          Copy-Item "dist/desktop/PacificDB-Workbench-$env:WORKBENCH_VERSION-win-x64.exe", `
            build/workbench-windows-x64.json -Destination build/workbench-upload
      - name: Record Windows preview staging evidence
        if: contains(env.WORKBENCH_VERSION, '-')
        shell: pwsh
        run: |
          node scripts/workbench-preview-evidence.mjs windows-x64 "dist/desktop/PacificDB-Workbench-$env:WORKBENCH_VERSION-win-x64.exe" build/workbench-windows-x64-preview.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build/workbench-upload | Out-Null
          Copy-Item "dist/desktop/PacificDB-Workbench-$env:WORKBENCH_VERSION-win-x64.exe", build/workbench-windows-x64-preview.json -Destination build/workbench-upload
      - uses: actions/upload-artifact@v6
        with:
          name: workbench-windows-x64
          if-no-files-found: error
          path: build/workbench-upload/*

  macos:
    if: inputs.release_tag == '' && !inputs.qualify_candidate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PACIFICDB_DESKTOP_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/workbench-v') || startsWith(inputs.release_tag, 'workbench-v')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKBENCH_RELEASE_TAG || inputs.source_ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Workbench and component versions
        run: |
          echo "WORKBENCH_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "PACIFICDB_COMPONENT_VERSION=$(python3 scripts/release_identity.py --field version)" >> "$GITHUB_ENV"
      - name: Validate candidate tag identity
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test "$GITHUB_REF_NAME" = "$(node -p 'require("./release.json").tag')"
      - run: npm ci --no-audit --no-fund
      - run: npm run test:npm
      - run: npm run test:build-tools
      - run: node --test scripts/test-workbench-preview-evidence.mjs
      - name: Build native engine and CLI
        shell: bash
        run: |
          set -euo pipefail
          triplet="${{ matrix.arch }}-osx"
          "$VCPKG_INSTALLATION_ROOT/vcpkg" install --triplet "$triplet" \
            --x-install-root="$PWD/build/vcpkg_installed"
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET="$triplet" \
            -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed" \
            -DPACIFICDB_ENGINE_VERSION="$PACIFICDB_COMPONENT_VERSION"
          cmake --build build --target db_engine pacificdb -j2
          if otool -L build/db_engine build/pacificdb | grep -E '/(opt/homebrew|usr/local)/(opt|Cellar)/'; then
            echo 'Native binaries must not depend on Homebrew libraries at runtime.' >&2
            exit 1
          fi
      - name: Require signing and notarization for release tags
        if: env.WORKBENCH_RELEASE_TAG != '' && env.WORKBENCH_RELEASE_TAG != 'workbench-v1.1.1'
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then echo "Missing $name" >&2; exit 1; fi
          done
      - run: node scripts/test-desktop-engine.mjs build
      - run: node scripts/test-workbench-desktop-vector-preview.mjs build
      - name: Package Workbench for macOS
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        run: |
          if [[ "$WORKBENCH_RELEASE_TAG" == workbench-v1.1.1 ]]; then
            export PACIFICDB_DESKTOP_RELEASE=0
          fi
          if [[ "$PACIFICDB_DESKTOP_RELEASE" != 1 ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run desktop:build -- --mac dmg --${{ matrix.arch }} --publish never
      - name: Mount and copy previous Workbench DMG
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/PacificDB-Workbench-1.1.1-mac-${{ matrix.arch }}.dmg"
          mount="$RUNNER_TEMP/workbench-previous-mount"
          curl -fL --retry 3 \
            "https://github.com/hitesh-reddy-k/pacificdb-community/releases/download/workbench-v1.1.1/PacificDB-Workbench-1.1.1-mac-${{ matrix.arch }}.dmg" \
            -o "$previous"
          mkdir -p "$mount" "$RUNNER_TEMP/workbench-previous-installed" \
            "$RUNNER_TEMP/workbench-previous-fixture"
          hdiutil attach "$previous" -mountpoint "$mount" -nobrowse
          ditto "$mount/PacificDB Workbench.app" \
            "$RUNNER_TEMP/workbench-previous-installed/PacificDB Workbench.app"
          hdiutil detach "$mount"
          ditto "$RUNNER_TEMP/workbench-previous-installed/PacificDB Workbench.app" \
            "$RUNNER_TEMP/workbench-previous-fixture/PacificDB Workbench.app"
      - name: Remove previous Workbench application
        run: rm -rf "$RUNNER_TEMP/workbench-previous-installed"
      - name: Mount and test candidate Workbench DMG
        shell: bash
        run: |
          set -euo pipefail
          candidate="$PWD/dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-${{ matrix.arch }}.dmg"
          mount="$RUNNER_TEMP/workbench-candidate-mount"
          installed="$RUNNER_TEMP/workbench-candidate/PacificDB Workbench.app"
          mkdir -p "$mount" "$RUNNER_TEMP/workbench-candidate" "$RUNNER_TEMP/workbench-data-macos"
          hdiutil attach "$candidate" -mountpoint "$mount" -nobrowse
          ditto "$mount/PacificDB Workbench.app" "$installed"
          hdiutil detach "$mount"
          executable="$installed/Contents/MacOS/PacificDB Workbench"
          PACIFICDB_TEST_DESKTOP_PREVIOUS="$RUNNER_TEMP/workbench-previous-fixture/PacificDB Workbench.app/Contents/MacOS/PacificDB Workbench" \
            PACIFICDB_TEST_DESKTOP="$executable" \
            PACIFICDB_TEST_DESKTOP_DATA="$RUNNER_TEMP/workbench-data-macos" \
            npm run test:workbench:desktop
          PACIFICDB_TEST_DESKTOP="$executable" npm run test:workbench:desktop
          if [[ "$PACIFICDB_DESKTOP_RELEASE" == 1 && "$WORKBENCH_RELEASE_TAG" != workbench-v1.1.1 ]]; then
            contents="$installed/Contents"
            codesign --verify --deep --strict --verbose=2 "$installed"
            codesign --verify --strict "$contents/Resources/engine/db_engine"
            codesign --verify --strict "$contents/Resources/engine/pacificdb"
          fi
      - name: Remove candidate Workbench application and verify data preservation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/workbench-candidate"
          test -d "$RUNNER_TEMP/workbench-data-macos/database"
      - name: Record macOS platform evidence
        if: ${{ !contains(env.WORKBENCH_VERSION, '-') }}
        run: |
          python3 scripts/workbench_release_qualification.py platform \
            --name macos-${{ matrix.arch }} --version "$WORKBENCH_VERSION" \
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-${{ matrix.arch }}.dmg" \
            --output "build/workbench-macos-${{ matrix.arch }}.json"
          mkdir -p build/workbench-upload
          cp "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-${{ matrix.arch }}.dmg" \
            "build/workbench-macos-${{ matrix.arch }}.json" build/workbench-upload/
      - name: Record macOS preview staging evidence
        if: contains(env.WORKBENCH_VERSION, '-')
        run: |
          node scripts/workbench-preview-evidence.mjs macos-${{ matrix.arch }} "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-${{ matrix.arch }}.dmg" build/workbench-macos-${{ matrix.arch }}-preview.json
          mkdir -p build/workbench-upload
          cp "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-${{ matrix.arch }}.dmg" build/workbench-macos-${{ matrix.arch }}-preview.json build/workbench-upload/
      - uses: actions/upload-artifact@v6
        with:
          name: workbench-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: build/workbench-upload/*

  release:
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/workbench-v') || startsWith(inputs.release_tag, 'workbench-v')) &&
      (inputs.release_tag != '' ||
        (needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success'))
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKBENCH_RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve Workbench and component versions
        run: |
          echo "WORKBENCH_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "PACIFICDB_COMPONENT_VERSION=$(python3 scripts/release_identity.py --field version)" >> "$GITHUB_ENV"
      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          version="${WORKBENCH_RELEASE_TAG#workbench-v}"
          test "$WORKBENCH_RELEASE_TAG" = "workbench-v$version"
          test "$version" = "$WORKBENCH_VERSION"
          test "$(python3 scripts/release_identity.py --field channel)" = stable
      - name: Download installers from tag build
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          pattern: workbench-*
          path: dist/desktop
          merge-multiple: true
      - name: Download immutable tag-build installers for retry
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/workbench-desktop.yml/runs?event=push&head_sha=$head_sha&per_page=100" \
            > "$RUNNER_TEMP/workbench-tag-runs.json"
          run_id=$(python3 - "$RUNNER_TEMP/workbench-tag-runs.json" "$WORKBENCH_RELEASE_TAG" <<'PY'
          import json
          import sys
          runs = json.load(open(sys.argv[1], encoding="utf-8"))["workflow_runs"]
          matches = [run for run in runs if run["head_branch"] == sys.argv[2]]
          if not matches:
              raise SystemExit("No completed tag build supplies immutable Workbench artifacts")
          print(max(matches, key=lambda run: run["created_at"])["id"])
          PY
          )
          mkdir -p dist/desktop
          for name in workbench-linux-x64 workbench-windows-x64 \
            workbench-macos-arm64 workbench-macos-x64; do
            gh run download "$run_id" --name "$name" --dir dist/desktop
          done
      - name: Decode external qualification evidence
        shell: bash
        env:
          WORKBENCH_PHYSICAL_POWER_EVIDENCE_BASE64: ${{ secrets.WORKBENCH_PHYSICAL_POWER_EVIDENCE_BASE64 }}
          WORKBENCH_SECURITY_REVIEW_EVIDENCE_BASE64: ${{ secrets.WORKBENCH_SECURITY_REVIEW_EVIDENCE_BASE64 }}
          WORKBENCH_LOAD_EVIDENCE_BASE64: ${{ secrets.WORKBENCH_LOAD_EVIDENCE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p build/external
          if [[ -n "$WORKBENCH_PHYSICAL_POWER_EVIDENCE_BASE64" ]]; then
            printf '%s' "$WORKBENCH_PHYSICAL_POWER_EVIDENCE_BASE64" | \
              base64 --decode > build/external/physical-power-result.json
          fi
          if [[ -n "$WORKBENCH_SECURITY_REVIEW_EVIDENCE_BASE64" ]]; then
            printf '%s' "$WORKBENCH_SECURITY_REVIEW_EVIDENCE_BASE64" | \
              base64 --decode > build/external/security-review.tar.gz
            mkdir -p build/external/security-review
            tar -xzf build/external/security-review.tar.gz \
              -C build/external/security-review
          fi
          if [[ -n "$WORKBENCH_LOAD_EVIDENCE_BASE64" ]]; then
            printf '%s' "$WORKBENCH_LOAD_EVIDENCE_BASE64" | \
              base64 --decode > build/external/workbench-load-result.json
          fi
      - name: Aggregate Workbench qualification
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > build/npm-audit.json || true
          args=(
            --version "$WORKBENCH_VERSION"
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb"
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-win-x64.exe"
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-arm64.dmg"
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-x64.dmg"
            --platform-result dist/desktop/workbench-linux-x64.json
            --platform-result dist/desktop/workbench-windows-x64.json
            --platform-result dist/desktop/workbench-macos-arm64.json
            --platform-result dist/desktop/workbench-macos-x64.json
            --audit-report build/npm-audit.json
            --output build/workbench-release-evidence.json
          )
          [[ ! -f build/external/physical-power-result.json ]] || \
            args+=(--physical-power-evidence build/external/physical-power-result.json)
          if [[ -f build/external/security-review/bundle-manifest.json && \
                -f build/external/security-review/review-result.json ]]; then
            args+=(--security-bundle build/external/security-review \
              --security-review build/external/security-review/review-result.json)
          fi
          [[ ! -f build/external/workbench-load-result.json ]] || \
            args+=(--load-evidence build/external/workbench-load-result.json)
          python3 scripts/workbench_release_qualification.py aggregate "${args[@]}"
      - name: Upload Workbench qualification report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: workbench-release-qualification
          if-no-files-found: error
          path: build/workbench-release-evidence.json
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/desktop
          sha256sum PacificDB-Workbench-*.deb PacificDB-Workbench-*.exe \
            PacificDB-Workbench-*.dmg > SHA256SUMS
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$WORKBENCH_RELEASE_TAG" dist/desktop/PacificDB-Workbench-*.deb \
            dist/desktop/PacificDB-Workbench-*.exe \
            dist/desktop/PacificDB-Workbench-*.dmg dist/desktop/SHA256SUMS \
            --latest=false --title "PacificDB Workbench ${WORKBENCH_RELEASE_TAG#workbench-v}" \
            --notes "Desktop Workbench with bundled engine and CLI for Linux, Windows, and macOS."

  prerelease_desktop_packages:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_desktop
    runs-on: ubuntu-24.04
    environment: prerelease-publish
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      PLATFORM_RUN_ID: ${{ inputs.desktop_source_run || '41302007858' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Verify public RC and build prerequisites
        run: |
          set -euo pipefail
          python3 scripts/check-sdk-release-tag.py "$RELEASE_TAG" --require-tag
          test "$(gh release view "$RELEASE_TAG" --json isPrerelease --jq .isPrerelease)" = true
          test "$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)" = false
          sudo apt-get update
          sudo apt-get install -y cmake g++ liblz4-dev libre2-dev libssl-dev xvfb xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1
          npm ci --no-audit --no-fund
          npm run test:build-tools
      - name: Build exact RC engine and Debian Workbench
        env:
          PACIFICDB_DESKTOP_UBUNTU_24: '1'
          PACIFICDB_DESKTOP_RELEASE: '1'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        run: |
          set -euo pipefail
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release -DPACIFICDB_ENGINE_VERSION=1.2.0
          cmake --build build --target db_engine pacificdb -j2
          # Restore upstream's application-scoped AppArmor setup on Ubuntu24.
          # The RC's custom postinst omitted it, making Chromium's SUID fallback
          # fail on the space in /opt/PacificDB Workbench. Keep the OS sandbox.
          npm run desktop:build -- --linux deb tar.gz --x64 --publish never \
            --config.deb.afterInstall="$PWD/node_modules/app-builder-lib/templates/linux/after-install.tpl"
      - name: Install candidate and test its GUI with normal sandbox
        run: |
          set -euo pipefail
          sudo apt-get install -y ./dist/desktop/PacificDB-Workbench-1.2.0-rc.2-linux-amd64.deb
          stat -c '%U:%G %a %n' '/opt/PacificDB Workbench/chrome-sandbox'
          DEBUG=pw:browser PACIFICDB_TEST_DESKTOP='/opt/PacificDB Workbench/pacificdb-workbench' xvfb-run -a npm run test:workbench:desktop
          mkdir -p build/release-platforms
          cp dist/desktop/PacificDB-Workbench-1.2.0-rc.2-linux-amd64.deb build/release-platforms/
          node scripts/workbench-preview-evidence.mjs linux-x64 build/release-platforms/PacificDB-Workbench-1.2.0-rc.2-linux-amd64.deb build/release-platforms/workbench-linux-x64-preview.json
          python3 - <<'PYCODE'
          import json,hashlib,os
          from pathlib import Path
          p=Path('build/release-platforms/workbench-linux-x64-preview.json');d=json.loads(p.read_text())
          d['packagingOverride']={'afterInstall':'electron-builder upstream templates/linux/after-install.tpl',
            'sha256':hashlib.sha256(Path('node_modules/app-builder-lib/templates/linux/after-install.tpl').read_bytes()).hexdigest(),
            'workflowRevision':os.environ['GITHUB_SHA'],'reason':'restore app-scoped AppArmor userns setup; keep normal Chromium sandbox'}
          p.write_text(json.dumps(d,indent=2)+'\n')
          PYCODE
      - name: Get Windows/macOS installers from successful exact-source jobs
        run: |
          set -euo pipefail
          gh run view "$PLATFORM_RUN_ID" --json headSha,jobs > build/platform-run.json
          python3 - <<'PYCODE'
          import json,subprocess
          d=json.load(open('build/platform-run.json'))
          assert d['headSha']==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          names={'windows','macos (macos-15, arm64)','macos (macos-15-intel, x64)'}
          assert all(any(j['name']==n and j['conclusion']=='success' for j in d['jobs']) for n in names)
          PYCODE
          for platform in windows-x64 macos-x64 macos-arm64; do
            gh run download "$PLATFORM_RUN_ID" --name "workbench-$platform" --dir "build/downloaded-$platform"
            cp "build/downloaded-$platform/"* build/release-platforms/
          done
      - name: Bind tested packages to qualified release manifest
        run: |
          set -euo pipefail
          mkdir -p build/release-staged
          gh release download "$RELEASE_TAG" --dir build/release-staged
          python3 scripts/verify-prerelease-staging.py --directory build/release-staged --revision "$(git rev-parse HEAD)" --require-qualified
          python3 - <<'PYCODE'
          import json,hashlib,shutil,subprocess
          from pathlib import Path
          from scripts.prerelease_qualification import assess
          root=Path('build/release-staged');m=json.load(open(root/'RELEASE-MANIFEST.json'));revision=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          for p in Path('build/release-platforms').glob('*preview.json'):
              receipt=json.load(open(p));assert receipt['revision']==revision and not receipt['sourceDirty']
              artifact=Path('build/release-platforms')/Path(receipt['artifact']['path']).name
              assert hashlib.sha256(artifact.read_bytes()).hexdigest()==receipt['artifact']['sha256']
              for f,platform in [(artifact,receipt['platform']),(p,'portable-platform-receipt')]:
                  assert not (root/f.name).exists();shutil.copy2(f,root/f.name);h=hashlib.sha256(f.read_bytes()).hexdigest()
                  m['artifacts'].append({'filename':f.name,'sha256':h,'sizeBytes':f.stat().st_size})
                  m['qualification']['artifacts'].append({'name':f.name,'sha256':h,'platform':platform,'tested':True})
          m['desktopDistribution']='Linux x64 Ubuntu24, Windows x64, macOS x64/arm64 installers attached; tested by exact-source CI jobs, prerelease signing limitations apply'
          m['pendingDistributionArtifacts']=['portable Linux archive and offline container archive; GHCR available']
          assert assess(m['qualification'])['decision']=='PREVIEW_QUALIFIED'
          (root/'RELEASE-MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          sums={a['filename']:a['sha256'] for a in m['artifacts']};sums['RELEASE-MANIFEST.json']=hashlib.sha256((root/'RELEASE-MANIFEST.json').read_bytes()).hexdigest()
          (root/'SHA256SUMS').write_text(''.join(h+'  '+n+'\n' for n,h in sorted(sums.items())))
          PYCODE
          python3 scripts/verify-prerelease-staging.py --directory build/release-staged --revision "$(git rev-parse HEAD)" --require-qualified
          gh release upload "$RELEASE_TAG" build/release-platforms/*
          gh release upload "$RELEASE_TAG" build/release-staged/RELEASE-MANIFEST.json build/release-staged/SHA256SUMS --clobber
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: desktop-publication-receipts
          path: |
            build/platform-run.json
            build/release-platforms/*preview.json
            build/release-staged/RELEASE-MANIFEST.json
            build/release-staged/SHA256SUMS
