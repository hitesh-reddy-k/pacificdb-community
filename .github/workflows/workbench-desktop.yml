name: PacificDB Workbench desktop

on:
  pull_request:
    paths:
      - '.github/workflows/workbench-desktop.yml'
      - 'desktop/**'
      - 'cli/**'
      - 'sdk/node/**'
      - 'engine/**'
      - 'scripts/test-workbench-*.mjs'
      - 'scripts/test-desktop-engine.mjs'
      - 'scripts/test-index-low-cardinality.mjs'
      - 'scripts/prepare-workbench-desktop.mjs'
      - 'package.json'
      - 'package-lock.json'
  push:
    branches: [pacificdb-v1.0]
    tags: ['workbench-v*']
    paths:
      - '.github/workflows/workbench-desktop.yml'
      - 'desktop/**'
      - 'cli/**'
      - 'sdk/node/**'
      - 'engine/**'
      - 'scripts/test-workbench-*.mjs'
      - 'scripts/test-desktop-engine.mjs'
      - 'scripts/test-index-low-cardinality.mjs'
      - 'scripts/prepare-workbench-desktop.mjs'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact existing workbench-vMAJOR.MINOR.PATCH tag to retry
        required: false

env:
  WORKBENCH_RELEASE_TAG: ${{ inputs.release_tag || (startsWith(github.ref, 'refs/tags/workbench-v') && github.ref_name) || '' }}

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  linux:
    if: inputs.release_tag == ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKBENCH_RELEASE_TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Workbench and component versions
        run: |
          echo "WORKBENCH_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "PACIFICDB_COMPONENT_VERSION=$(node -p 'require("./cli/package.json").version')" >> "$GITHUB_ENV"
      - name: Install native and GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ liblz4-dev libre2-dev libssl-dev xvfb \
            xauth libgtk-3-0t64 libnss3 libasound2t64 libgbm1 libxss1
      - run: npm ci --no-audit --no-fund
      - run: npm run test:npm
      - run: npm run test:build-tools
      - name: Build native engine and CLI
        run: |
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release \
            -DPACIFICDB_ENGINE_VERSION="$PACIFICDB_COMPONENT_VERSION"
          cmake --build build --target db_engine pacificdb -j2
      - run: node scripts/test-workbench-e2e.mjs build
      - run: node scripts/test-desktop-engine.mjs build
      - run: node scripts/test-index-low-cardinality.mjs build
      - name: Browser workflow
        run: |
          npx playwright install --with-deps chromium
          npm run test:workbench:browser -- build
      - name: Package Workbench for Ubuntu 24.04
        env:
          PACIFICDB_DESKTOP_UBUNTU_24: '1'
          PACIFICDB_DESKTOP_RELEASE: '1'
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        run: npm run desktop:build -- --linux deb tar.gz --x64
      - name: Download and install previous Workbench Debian
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/PacificDB-Workbench-1.1.1-linux-amd64.deb"
          curl -fL --retry 3 \
            "https://github.com/hitesh-reddy-k/pacificdb-community/releases/download/workbench-v1.1.1/PacificDB-Workbench-1.1.1-linux-amd64.deb" \
            -o "$previous"
          sudo apt-get install -y "$previous"
          sudo cp -a "/opt/PacificDB Workbench" "$RUNNER_TEMP/workbench-previous-linux"
      - name: Remove previous Workbench Debian
        run: sudo apt-get remove -y pacificdb-workbench
      - name: Install and test candidate Workbench Debian
        shell: bash
        run: |
          set -euo pipefail
          candidate="$PWD/dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb"
          test -f "$candidate"
          sudo apt-get install -y "$candidate"
          mkdir -p "$RUNNER_TEMP/workbench-data-linux"
          PACIFICDB_TEST_DESKTOP_PREVIOUS="$RUNNER_TEMP/workbench-previous-linux/pacificdb-workbench" \
            PACIFICDB_TEST_DESKTOP="/opt/PacificDB Workbench/pacificdb-workbench" \
            PACIFICDB_TEST_DESKTOP_DATA="$RUNNER_TEMP/workbench-data-linux" \
            xvfb-run -a npm run test:workbench:desktop
      - name: Remove candidate Workbench Debian and verify data preservation
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get remove -y pacificdb-workbench
          test -d "$RUNNER_TEMP/workbench-data-linux/database"
      - name: Record Linux platform evidence
        run: |
          python3 scripts/workbench_release_qualification.py platform \
            --name linux-x64 --version "$WORKBENCH_VERSION" \
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb" \
            --output build/workbench-linux-x64.json
          mkdir -p build/workbench-upload
          cp "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb" \
            build/workbench-linux-x64.json build/workbench-upload/
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-linux-x64
          if-no-files-found: error
          path: build/workbench-upload/*

  windows:
    if: inputs.release_tag == ''
    runs-on: windows-2025
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
      PACIFICDB_DESKTOP_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/workbench-v') || startsWith(inputs.release_tag, 'workbench-v')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKBENCH_RELEASE_TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Workbench and component versions
        shell: pwsh
        run: |
          "WORKBENCH_VERSION=$(node -p 'require("./package.json").version')" >> $env:GITHUB_ENV
          "PACIFICDB_COMPONENT_VERSION=$(node -p 'require("./cli/package.json").version')" >> $env:GITHUB_ENV
      - run: npm ci --no-audit --no-fund
      - run: npm run test:npm
      - run: npm run test:build-tools
      - name: Build static native binaries
        shell: pwsh
        run: |
          vcpkg install --triplet x64-windows-static `
            --x-install-root="$pwd/build/vcpkg_installed"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake -S engine -B build -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_INSTALLED_DIR="$pwd/build/vcpkg_installed" `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded `
            -DPACIFICDB_ENGINE_VERSION="$env:PACIFICDB_COMPONENT_VERSION"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cmake --build build --config Release --target db_engine pacificdb
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Require signing credentials for release tags
        if: env.WORKBENCH_RELEASE_TAG != '' && env.WORKBENCH_RELEASE_TAG != 'workbench-v1.1.1'
        shell: pwsh
        run: |
          if (-not $env:CSC_LINK -or -not $env:CSC_KEY_PASSWORD) {
            throw 'Windows code signing credentials are required for a Workbench release.'
          }
      - name: Verify engine isolation and graceful shutdown
        shell: pwsh
        run: |
          node scripts/test-desktop-engine.mjs build/Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Sign bundled native executables for release tags
        if: env.WORKBENCH_RELEASE_TAG != '' && env.WORKBENCH_RELEASE_TAG != 'workbench-v1.1.1'
        shell: pwsh
        run: |
          $certificate = "$env:RUNNER_TEMP\workbench-signing.pfx"
          try {
            [IO.File]::WriteAllBytes($certificate, [Convert]::FromBase64String($env:CSC_LINK))
            $signtool = (Get-ChildItem 'C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe' |
              Sort-Object FullName -Descending | Select-Object -First 1).FullName
            if (-not $signtool) { throw 'SignTool was not found.' }
            foreach ($file in @('build/Release/db_engine.exe', 'build/Release/pacificdb.exe')) {
              & $signtool sign /f $certificate /p $env:CSC_KEY_PASSWORD /tr https://timestamp.digicert.com /td sha256 /fd sha256 $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              & $signtool verify /pa $file
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          } finally { Remove-Item $certificate -Force -ErrorAction SilentlyContinue }
      - name: Package Workbench for Windows x64
        shell: pwsh
        run: |
          $env:PACIFICDB_WORKBENCH_ENGINE = "$pwd\build\Release\db_engine.exe"
          $env:ELECTRON_BUILDER_COMPRESSION_LEVEL = '1'
          if ($env:WORKBENCH_RELEASE_TAG -eq 'workbench-v1.1.1') {
            $env:PACIFICDB_DESKTOP_RELEASE = '0'
          }
          if ($env:PACIFICDB_DESKTOP_RELEASE -ne '1') {
            Remove-Item Env:CSC_LINK,Env:CSC_KEY_PASSWORD -ErrorAction SilentlyContinue
          }
          npm run desktop:build -- --win nsis --x64 --publish never
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Download and install previous Workbench NSIS
        shell: pwsh
        run: |
          $previous = "$env:RUNNER_TEMP\PacificDB-Workbench-1.1.1-win-x64.exe"
          $installed = "$env:RUNNER_TEMP\workbench-previous-installed"
          $fixture = "$env:RUNNER_TEMP\workbench-previous-fixture"
          Invoke-WebRequest `
            -Uri 'https://github.com/hitesh-reddy-k/pacificdb-community/releases/download/workbench-v1.1.1/PacificDB-Workbench-1.1.1-win-x64.exe' `
            -OutFile $previous
          $process = Start-Process -FilePath $previous -ArgumentList @('/S', "/D=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          New-Item -ItemType Directory -Force -Path $fixture | Out-Null
          Copy-Item -Path "$installed\*" -Destination $fixture -Recurse
      - name: Uninstall previous Workbench NSIS
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem "$env:RUNNER_TEMP\workbench-previous-installed" -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Previous Workbench uninstaller was not found.' }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
      - name: Install and test candidate Workbench NSIS
        shell: pwsh
        run: |
          $candidate = Get-Item "$pwd\dist\desktop\PacificDB-Workbench-$env:WORKBENCH_VERSION-win-x64.exe"
          $installed = "$env:RUNNER_TEMP\workbench-candidate-installed"
          $data = "$env:RUNNER_TEMP\workbench-data-windows"
          $process = Start-Process -FilePath $candidate.FullName -ArgumentList @('/S', "/D=$installed") -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          New-Item -ItemType Directory -Force -Path $data | Out-Null
          $env:PACIFICDB_TEST_DESKTOP_PREVIOUS = "$env:RUNNER_TEMP\workbench-previous-fixture\PacificDB Workbench.exe"
          $env:PACIFICDB_TEST_DESKTOP = "$installed\PacificDB Workbench.exe"
          $env:PACIFICDB_TEST_DESKTOP_DATA = $data
          npm run test:workbench:desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Uninstall candidate Workbench NSIS and verify data preservation
        shell: pwsh
        run: |
          $uninstaller = Get-ChildItem "$env:RUNNER_TEMP\workbench-candidate-installed" -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw 'Candidate Workbench uninstaller was not found.' }
          $process = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($process.ExitCode -ne 0) { exit $process.ExitCode }
          if (-not (Test-Path "$env:RUNNER_TEMP\workbench-data-windows\database" -PathType Container)) {
            throw 'Workbench data directory was removed by uninstall.'
          }
      - name: Record Windows platform evidence
        shell: pwsh
        run: |
          python scripts/workbench_release_qualification.py platform `
            --name windows-x64 --version $env:WORKBENCH_VERSION `
            --artifact "dist/desktop/PacificDB-Workbench-$env:WORKBENCH_VERSION-win-x64.exe" `
            --output build/workbench-windows-x64.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          New-Item -ItemType Directory -Force -Path build/workbench-upload | Out-Null
          Copy-Item "dist/desktop/PacificDB-Workbench-$env:WORKBENCH_VERSION-win-x64.exe", `
            build/workbench-windows-x64.json -Destination build/workbench-upload
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-windows-x64
          if-no-files-found: error
          path: build/workbench-upload/*

  macos:
    if: inputs.release_tag == ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      PACIFICDB_DESKTOP_RELEASE: ${{ (startsWith(github.ref, 'refs/tags/workbench-v') || startsWith(inputs.release_tag, 'workbench-v')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKBENCH_RELEASE_TAG || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Resolve Workbench and component versions
        run: |
          echo "WORKBENCH_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "PACIFICDB_COMPONENT_VERSION=$(node -p 'require("./cli/package.json").version')" >> "$GITHUB_ENV"
      - run: brew install cmake vcpkg
      - run: npm ci --no-audit --no-fund
      - run: npm run test:npm
      - run: npm run test:build-tools
      - name: Build native engine and CLI
        shell: bash
        run: |
          set -euo pipefail
          vcpkg install --triplet arm64-osx \
            --x-install-root="$PWD/build/vcpkg_installed"
          cmake -S engine -B build -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="$(brew --prefix vcpkg)/libexec/scripts/buildsystems/vcpkg.cmake" \
            -DVCPKG_TARGET_TRIPLET=arm64-osx \
            -DVCPKG_INSTALLED_DIR="$PWD/build/vcpkg_installed" \
            -DPACIFICDB_ENGINE_VERSION="$PACIFICDB_COMPONENT_VERSION"
          cmake --build build --target db_engine pacificdb -j2
          if otool -L build/db_engine build/pacificdb | grep -E '/(opt/homebrew|usr/local)/(opt|Cellar)/'; then
            echo 'Native binaries must not depend on Homebrew libraries at runtime.' >&2
            exit 1
          fi
      - name: Require signing and notarization for release tags
        if: env.WORKBENCH_RELEASE_TAG != '' && env.WORKBENCH_RELEASE_TAG != 'workbench-v1.1.1'
        run: |
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [[ -z "${!name}" ]]; then echo "Missing $name" >&2; exit 1; fi
          done
      - run: node scripts/test-desktop-engine.mjs build
      - name: Package Workbench for macOS
        env:
          ELECTRON_BUILDER_COMPRESSION_LEVEL: '1'
        run: |
          if [[ "$WORKBENCH_RELEASE_TAG" == workbench-v1.1.1 ]]; then
            export PACIFICDB_DESKTOP_RELEASE=0
          fi
          if [[ "$PACIFICDB_DESKTOP_RELEASE" != 1 ]]; then
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npm run desktop:build -- --mac dmg --${{ matrix.arch }} --publish never
      - name: Mount and copy previous Workbench DMG
        shell: bash
        run: |
          set -euo pipefail
          previous="$RUNNER_TEMP/PacificDB-Workbench-1.1.1-mac-${{ matrix.arch }}.dmg"
          mount="$RUNNER_TEMP/workbench-previous-mount"
          curl -fL --retry 3 \
            "https://github.com/hitesh-reddy-k/pacificdb-community/releases/download/workbench-v1.1.1/PacificDB-Workbench-1.1.1-mac-${{ matrix.arch }}.dmg" \
            -o "$previous"
          mkdir -p "$mount" "$RUNNER_TEMP/workbench-previous-installed" \
            "$RUNNER_TEMP/workbench-previous-fixture"
          hdiutil attach "$previous" -mountpoint "$mount" -nobrowse
          ditto "$mount/PacificDB Workbench.app" \
            "$RUNNER_TEMP/workbench-previous-installed/PacificDB Workbench.app"
          hdiutil detach "$mount"
          ditto "$RUNNER_TEMP/workbench-previous-installed/PacificDB Workbench.app" \
            "$RUNNER_TEMP/workbench-previous-fixture/PacificDB Workbench.app"
      - name: Remove previous Workbench application
        run: rm -rf "$RUNNER_TEMP/workbench-previous-installed"
      - name: Mount and test candidate Workbench DMG
        shell: bash
        run: |
          set -euo pipefail
          candidate="$PWD/dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-${{ matrix.arch }}.dmg"
          mount="$RUNNER_TEMP/workbench-candidate-mount"
          installed="$RUNNER_TEMP/workbench-candidate/PacificDB Workbench.app"
          mkdir -p "$mount" "$RUNNER_TEMP/workbench-candidate" "$RUNNER_TEMP/workbench-data-macos"
          hdiutil attach "$candidate" -mountpoint "$mount" -nobrowse
          ditto "$mount/PacificDB Workbench.app" "$installed"
          hdiutil detach "$mount"
          executable="$installed/Contents/MacOS/PacificDB Workbench"
          PACIFICDB_TEST_DESKTOP_PREVIOUS="$RUNNER_TEMP/workbench-previous-fixture/PacificDB Workbench.app/Contents/MacOS/PacificDB Workbench" \
            PACIFICDB_TEST_DESKTOP="$executable" \
            PACIFICDB_TEST_DESKTOP_DATA="$RUNNER_TEMP/workbench-data-macos" \
            npm run test:workbench:desktop
          if [[ "$PACIFICDB_DESKTOP_RELEASE" == 1 && "$WORKBENCH_RELEASE_TAG" != workbench-v1.1.1 ]]; then
            contents="$installed/Contents"
            codesign --verify --deep --strict --verbose=2 "$installed"
            codesign --verify --strict "$contents/Resources/engine/db_engine"
            codesign --verify --strict "$contents/Resources/engine/pacificdb"
          fi
      - name: Remove candidate Workbench application and verify data preservation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/workbench-candidate"
          test -d "$RUNNER_TEMP/workbench-data-macos/database"
      - name: Record macOS platform evidence
        run: |
          python3 scripts/workbench_release_qualification.py platform \
            --name macos-${{ matrix.arch }} --version "$WORKBENCH_VERSION" \
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-${{ matrix.arch }}.dmg" \
            --output "build/workbench-macos-${{ matrix.arch }}.json"
          mkdir -p build/workbench-upload
          cp "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-${{ matrix.arch }}.dmg" \
            "build/workbench-macos-${{ matrix.arch }}.json" build/workbench-upload/
      - uses: actions/upload-artifact@v4
        with:
          name: workbench-macos-${{ matrix.arch }}
          if-no-files-found: error
          path: build/workbench-upload/*

  release:
    if: >-
      always() &&
      (startsWith(github.ref, 'refs/tags/workbench-v') || startsWith(inputs.release_tag, 'workbench-v')) &&
      (inputs.release_tag != '' ||
        (needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success'))
    needs: [linux, windows, macos]
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.WORKBENCH_RELEASE_TAG }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Resolve Workbench and component versions
        run: |
          echo "WORKBENCH_VERSION=$(node -p 'require("./package.json").version')" >> "$GITHUB_ENV"
          echo "PACIFICDB_COMPONENT_VERSION=$(node -p 'require("./cli/package.json").version')" >> "$GITHUB_ENV"
      - name: Check release version
        shell: bash
        run: |
          set -euo pipefail
          version="${WORKBENCH_RELEASE_TAG#workbench-v}"
          test "$WORKBENCH_RELEASE_TAG" = "workbench-v$version"
          test "$version" = "$WORKBENCH_VERSION"
      - name: Download installers from tag build
        if: inputs.release_tag == ''
        uses: actions/download-artifact@v4
        with:
          pattern: workbench-*
          path: dist/desktop
          merge-multiple: true
      - name: Download immutable tag-build installers for retry
        if: inputs.release_tag != ''
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head_sha=$(git rev-parse HEAD)
          gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/workbench-desktop.yml/runs?event=push&head_sha=$head_sha&per_page=100" \
            > "$RUNNER_TEMP/workbench-tag-runs.json"
          run_id=$(python3 - "$RUNNER_TEMP/workbench-tag-runs.json" "$WORKBENCH_RELEASE_TAG" <<'PY'
          import json
          import sys
          runs = json.load(open(sys.argv[1], encoding="utf-8"))["workflow_runs"]
          matches = [run for run in runs if run["head_branch"] == sys.argv[2]]
          if not matches:
              raise SystemExit("No completed tag build supplies immutable Workbench artifacts")
          print(max(matches, key=lambda run: run["created_at"])["id"])
          PY
          )
          mkdir -p dist/desktop
          for name in workbench-linux-x64 workbench-windows-x64 \
            workbench-macos-arm64 workbench-macos-x64; do
            gh run download "$run_id" --name "$name" --dir dist/desktop
          done
      - name: Decode external qualification evidence
        shell: bash
        env:
          WORKBENCH_PHYSICAL_POWER_EVIDENCE_BASE64: ${{ secrets.WORKBENCH_PHYSICAL_POWER_EVIDENCE_BASE64 }}
          WORKBENCH_SECURITY_REVIEW_EVIDENCE_BASE64: ${{ secrets.WORKBENCH_SECURITY_REVIEW_EVIDENCE_BASE64 }}
          WORKBENCH_LOAD_EVIDENCE_BASE64: ${{ secrets.WORKBENCH_LOAD_EVIDENCE_BASE64 }}
        run: |
          set -euo pipefail
          mkdir -p build/external
          if [[ -n "$WORKBENCH_PHYSICAL_POWER_EVIDENCE_BASE64" ]]; then
            printf '%s' "$WORKBENCH_PHYSICAL_POWER_EVIDENCE_BASE64" | \
              base64 --decode > build/external/physical-power-result.json
          fi
          if [[ -n "$WORKBENCH_SECURITY_REVIEW_EVIDENCE_BASE64" ]]; then
            printf '%s' "$WORKBENCH_SECURITY_REVIEW_EVIDENCE_BASE64" | \
              base64 --decode > build/external/security-review.tar.gz
            mkdir -p build/external/security-review
            tar -xzf build/external/security-review.tar.gz \
              -C build/external/security-review
          fi
          if [[ -n "$WORKBENCH_LOAD_EVIDENCE_BASE64" ]]; then
            printf '%s' "$WORKBENCH_LOAD_EVIDENCE_BASE64" | \
              base64 --decode > build/external/workbench-load-result.json
          fi
      - name: Aggregate Workbench qualification
        shell: bash
        run: |
          set -euo pipefail
          npm audit --omit=dev --json > build/npm-audit.json || true
          args=(
            --version "$WORKBENCH_VERSION"
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-linux-amd64.deb"
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-win-x64.exe"
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-arm64.dmg"
            --artifact "dist/desktop/PacificDB-Workbench-${WORKBENCH_VERSION}-mac-x64.dmg"
            --platform-result dist/desktop/workbench-linux-x64.json
            --platform-result dist/desktop/workbench-windows-x64.json
            --platform-result dist/desktop/workbench-macos-arm64.json
            --platform-result dist/desktop/workbench-macos-x64.json
            --audit-report build/npm-audit.json
            --output build/workbench-release-evidence.json
          )
          [[ ! -f build/external/physical-power-result.json ]] || \
            args+=(--physical-power-evidence build/external/physical-power-result.json)
          if [[ -f build/external/security-review/bundle-manifest.json && \
                -f build/external/security-review/review-result.json ]]; then
            args+=(--security-bundle build/external/security-review \
              --security-review build/external/security-review/review-result.json)
          fi
          [[ ! -f build/external/workbench-load-result.json ]] || \
            args+=(--load-evidence build/external/workbench-load-result.json)
          python3 scripts/workbench_release_qualification.py aggregate "${args[@]}"
      - name: Upload Workbench qualification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workbench-release-qualification
          if-no-files-found: error
          path: build/workbench-release-evidence.json
      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail
          cd dist/desktop
          sha256sum PacificDB-Workbench-*.deb PacificDB-Workbench-*.exe \
            PacificDB-Workbench-*.dmg > SHA256SUMS
      - name: Publish verified installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$WORKBENCH_RELEASE_TAG" dist/desktop/PacificDB-Workbench-*.deb \
            dist/desktop/PacificDB-Workbench-*.exe \
            dist/desktop/PacificDB-Workbench-*.dmg dist/desktop/SHA256SUMS \
            --title "PacificDB Workbench ${WORKBENCH_RELEASE_TAG#workbench-v}" \
            --notes "Desktop Workbench with bundled engine and CLI for Linux, Windows, and macOS."
