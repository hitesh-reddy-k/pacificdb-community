{{- $peers := list -}}
{{- range $i := until (int .Values.replicaCount) -}}
{{- $id := printf "%s-pacificdb-%d" $.Release.Name $i -}}
{{- $host := printf "%s.%s-pacificdb.%s.svc.cluster.local:9001" $id $.Release.Name $.Release.Namespace -}}
{{- $peers = append $peers (printf "%s@%s" $id $host) -}}
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-pacificdb
spec:
  clusterIP: None
  selector: { app.kubernetes.io/name: pacificdb, app.kubernetes.io/instance: {{ .Release.Name }} }
  ports:
    - { name: client, port: 9000 }
    - { name: raft, port: 9001 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-pacificdb
spec:
  serviceName: {{ .Release.Name }}-pacificdb
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: { app.kubernetes.io/name: pacificdb, app.kubernetes.io/instance: {{ .Release.Name }} }
  template:
    metadata:
      labels: { app.kubernetes.io/name: pacificdb, app.kubernetes.io/instance: {{ .Release.Name }} }
    spec:
      securityContext: { runAsNonRoot: true, fsGroup: 10001 }
      containers:
        - name: engine
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: ["ALL"] } }
          ports:
            - { name: client, containerPort: 9000 }
            - { name: raft, containerPort: 9001 }
          env:
            - { name: RAFT_CLUSTER_ID, value: pacificdb-community }
            - name: RAFT_NODE_ID
              valueFrom: { fieldRef: { fieldPath: metadata.name } }
            - { name: DATA_ROOT, value: /var/lib/pacificdb/data }
            - { name: BACKUP_ROOT, value: /var/lib/pacificdb/backup }
            - { name: RESTORE_DIR, value: /var/lib/pacificdb/restore }
            - { name: ENGINE_BIND_HOST, value: 0.0.0.0 }
            - { name: RAFT_BIND_HOST, value: 0.0.0.0 }
            - { name: RAFT_REPLICATION_MODE, value: sync }
            - { name: MIN_QUORUM_SIZE, value: "2" }
            - { name: RAFT_PEERS, value: {{ join "," $peers | quote }} }
            - { name: ENGINE_AUTH_REQUIRED, value: "{{ .Values.security.authRequired }}" }
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /var/lib/pacificdb }
          readinessProbe: { tcpSocket: { port: client }, initialDelaySeconds: 5 }
          livenessProbe: { tcpSocket: { port: client }, initialDelaySeconds: 15 }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.storage.className }}
        storageClassName: {{ .Values.storage.className }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.storage.size }} } }
