# Default profile: local development only. Use values-production.yaml plus
# operator-supplied secret, storage, evidence, and digest values for production.
production:
  enabled: false

replicaCount: 1

image:
  repository: ghcr.io/hitesh-reddy-k/pacificdb-community
  tag: ""
  digest: sha256:4694fed9d3285e25b2f532017c0992a5ca5a57def7a44dc53ec0fc27d49615b7
  pullPolicy: IfNotPresent

storage:
  className: ""
  size: 20Gi

backupStorage:
  className: ""
  size: 50Gi

resources:
  requests: { cpu: 500m, memory: 1Gi }
  limits: { cpu: "2", memory: 4Gi }

security:
  authRequired: true
  clientTlsSecret: ""
  raftTlsSecret: ""
  bootstrapSecret: pacificdb-bootstrap
  encryptionEvidenceConfigMap: ""
